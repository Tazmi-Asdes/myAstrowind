kind: pipeline
type: docker
name: deploy

steps:
  - name: 构建和部署
    image: node:20-alpine
    commands:
      - apk add git
      - npm install -g pnpm
      - pnpm install
      - pnpm run build
      - cp -r dist/* /opt/1panel/apps/openresty/openresty/www/sites/tazmi.online/index/
    volumes:
      - name: website
        path: /opt/1panel/apps/openresty/openresty/www/sites/tazmi.online/index/

volumes:
  - name: website
    host:
      path: /opt/1panel/apps/openresty/openresty/www/sites/tazmi.online/index/
